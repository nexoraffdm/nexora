
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090711">
    <title>NEXORA | Menú principal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top, #39206b 0%, transparent 45%),
                linear-gradient(135deg, #090711, #140d25 55%, #090711);
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
            padding: 35px 25px;
            text-align: center;
            background: rgba(20, 15, 35, 0.94);
            border: 1px solid rgba(166, 105, 255, 0.35);
            border-radius: 22px;
            box-shadow: 0 0 35px rgba(126, 60, 255, 0.18);
        }

        .logo {
            width: 145px;
            height: 145px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(160, 90, 255, 0.35));
        }

        h1 {
            font-size: 34px;
            letter-spacing: 5px;
            color: #c49aff;
            margin-bottom: 8px;
        }

        .descripcion {
            color: #aaa1bd;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .opciones {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .opcion {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 17px;
            text-decoration: none;
            color: white;
            text-align: left;
            background: #211833;
            border: 1px solid #382653;
            border-radius: 13px;
            transition: 0.25s ease;
        }

        .opcion:hover {
            transform: translateY(-3px);
            background: #302044;
            border-color: #a66aff;
            box-shadow: 0 5px 20px rgba(147, 80, 255, 0.15);
        }

        .icono {
            font-size: 27px;
            width: 35px;
            text-align: center;
        }

        .texto {
            flex: 1;
        }

        .texto strong {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .texto small {
            color: #aaa1bd;
            font-size: 12px;
        }

        .flecha {
            font-size: 25px;
            color: #b98aff;
        }

        footer {
            margin-top: 28px;
            color: #716783;
            font-size: 11px;
        }

        @media (max-width: 380px) {
            .contenedor {
                padding: 28px 18px;
            }

            h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <img src="nexora.jpeg" alt="Logo NEXORA" class="logo">

        <h1>NEXORA</h1>

        <p class="descripcion">
            Diamantes a buen precio para Free Fire
        </p>

        <section class="opciones">

            <!-- CANAL DE WHATSAPP -->
            <a
                class="opcion"
                href="https://whatsapp.com/channel/0029Vb9eHRHFHWq0rrZymC1B"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icono">📢</span>

                <span class="texto">
                    <strong>Canal de WhatsApp</strong>
                    <small>Noticias, novedades y promociones</small>
                </span>

                <span class="flecha">›</span>
            </a>

            <!-- TORNEOS -->
            <a
                class="opcion"
                href="https://chat.whatsapp.com/BdnlYBBxCFhDFqEiShluZs"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="icono">🏆</span>

                <span class="texto">
                    <strong>Torneos</strong>
                    <small>Entra al grupo y participa</small>
                </span>

                <span class="flecha">›</span>
            </a>

            <!-- DIAMANTES -->
            <a class="opcion" href="diamantes.html">
                <span class="icono">💎</span>

                <span class="texto">
                    <strong>Comprar diamantes</strong>
                    <small>Consulta nuestros paquetes y precios</small>
                </span>

                <span class="flecha">›</span>
            </a>

        </section>

        <footer>
            © 2026 NEXORA. Todos los derechos reservados.
        </footer>

    </main>

</body>
</html>
